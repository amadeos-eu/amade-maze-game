dialog.about.text=The classic chase through the maze: eat every dot while four ghosts hunt you, each in its own way.
dialog.about.rules=A dot is worth 10 points, an energizer 50. After an energizer the ghosts turn blue for a few seconds: eat them for 200, 400, 800 and 1,600 points. Fruit appears twice a level. An extra life at 10,000 points. P pauses, F11 switches to full screen and back.
