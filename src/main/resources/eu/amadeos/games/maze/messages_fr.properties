dialog.about.rules=Une pastille vaut 10 points, une super-pastille 50. Après une super-pastille, les fantômes deviennent bleus pendant quelques secondes : mangez-les pour 200, 400, 800 et 1 600 points. Un fruit apparaît deux fois par niveau. Une vie de plus à 10 000 points. P met en pause, F11 passe en plein écran et revient.
