dialog.about.rules=Un puntino vale 10 punti, una pillola di potenza 50. Dopo una pillola di potenza i fantasmi diventano blu per qualche secondo: mangiali per 200, 400, 800 e 1.600 punti. La frutta compare due volte per livello. Una vita in più a 10.000 punti. P mette in pausa, F11 passa a schermo intero e torna indietro.
